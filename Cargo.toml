[package]
name = "mtsw-shot"
version = "0.1.0"
edition = "2024"
description = "Screenshot and annotation tool for Wayland (niri first)"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
kbvm = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
tiny-skia = "0.11"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wl-clipboard-rs = "0.9"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# tiny-skia has debug assertions that fire on harmless sub-pixel geometry.
debug-assertions = false
